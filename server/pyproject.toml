[project]
name = "chem-quest-server"
version = "0.1.0"
description = "Backend service for Chem Quest"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "faster-whisper>=1.1,<2.0",
    "numpy>=1.26,<3.0",
    "ollama>=0.4,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
